service: teplotec_project
image: sergii/tp-installer-3f3

servers:
  web:
    - ssh.teplotec.com

ssh:
  user: root
  keys:
    - ~/.ssh/teplotec
  forward_agent: false
  proxy_command: "cloudflared access ssh --hostname ssh.teplotec.com"

registry:
  server: ghcr.io
  username: sergii
  password:
    - KAMAL_REGISTRY_PASSWORD

proxy:
  host: project.teplotec.com
  app_port: 80
  ssl: false
  forward_headers: true
  healthcheck:
    path: /up
  run:
    http_port: 3001
    https_port: 3443
    bind_ips:
      - 127.0.0.1

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "teplotec_project_storage:/rails/storage"

asset_path: /rails/public

builder:
  arch: amd64

accessories:
  postgres:
    service: teplotec-project-postgres
    image: postgres:18.4
    host: ssh.teplotec.com
    env:
      clear:
        POSTGRES_USER: teplotec
        POSTGRES_DB: teplotec_project
      secret:
        - POSTGRES_PASSWORD:PROJECT_DB_PASSWORD
    directories:
      - /opt/teplotec/project/postgresql:/var/lib/postgresql
    files:
      - config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-create-databases.sql:ro
